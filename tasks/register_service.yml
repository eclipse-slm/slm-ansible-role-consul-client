### Inputs
- name: "CONSUL_CLIENT | Assert inputs of 'consul/client | register_service.yml'"
  ansible.builtin.assert:
    that:
      - (ENV.CONSUL.SCHEME.INTERNAL is defined) and (ENV.CONSUL.SCHEME.INTERNAL|length > 0)       # Scheme of the Consul instance
      - (ENV.CONSUL.HOST.INTERNAL is defined) and (ENV.CONSUL.HOST.INTERNAL|length > 0)           # Host of the Consul instance
      - (ENV.CONSUL.PORT.INTERNAL is defined)                                                     # Port of the Consul instance
      - (_consul_token is defined) and (_consul_token|length > 0)                                 # Token to authenticate with Consul
      - (_service_name is defined) and (_service_name|length > 0)                                 # Name of the service
      - (_service_port is defined)                                                                # Port of the service
      - (_service_address is defined) and (_service_address|length > 0)                           # Address of the service
      ### Optional
      # _additional_tags                                                                          # Additional tags of the service in addition to the default ones
      # _meta                                                                                      # Meta data of the service

- name: "CONSUL_CLIENT | Set default tags for service '{{ _service_name }}'"
  ansible.builtin.set_fact:
    consul_tags:
      - "slm"
      - "backend"

- name: "CONSUL_CLIENT | Add additional tags for service '{{ _service_name }}'"
  ansible.builtin.set_fact:
    consul_tags: "{{ consul_tags + _additional_tags | default([]) }}"


- name: "CONSUL_CLIENT | Register service '{{ _service_name }}' at Consul (discovery server)"
  community.general.consul_agent_service:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ _consul_token }}"
    name: "{{ _service_name }}"
    service_port: "{{ _service_port }}"
    address: "{{ _service_address }}"
    tags: "{{ consul_tags }}"
    meta: "{{ _meta | default({}) }}"

- name: "CONSUL_CLIENT | Register HTTP health check for service '{{ _service_name }}' at Consul (discovery server)"
  community.general.consul_agent_check:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ _consul_token }}"
    name: "http_{{ _service_name }}"
    service_id: "{{ _service_name }}"
    interval: 60s
    http: "{{ _http }}"
  when: (_http is defined) and (_http|length > 0)

- name: "CONSUL_CLIENT | Register TCP health check for service '{{ _service_name }}' at Consul (discovery server)"
  community.general.consul_agent_check:
    scheme: "{{ ENV.CONSUL.SCHEME.INTERNAL }}"
    host: "{{ ENV.CONSUL.HOST.INTERNAL }}"
    port: "{{ ENV.CONSUL.PORT.INTERNAL }}"
    token: "{{ _consul_token }}"
    name: "tcp_{{ _service_name }}"
    service_id: "{{ _service_name }}"
    interval: 60s
    tcp: "{{ _tcp }}"
  when: (_tcp is defined) and (_tcp|length > 0)
