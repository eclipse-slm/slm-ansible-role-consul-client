#           token=_consul_token)
#         | from_yaml
#       }}

- name: "CONSUL_CLIENT | Add config to variable app_configs['{{ _app_name }}']"
  ansible.builtin.set_fact:
    app_configs: "{{ app_configs | default({}) | combine(
      { 
        _app_name: app_config_consul | from_yaml
      }, recursive=true) }}"
