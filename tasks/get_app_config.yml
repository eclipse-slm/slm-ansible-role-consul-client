### Inputs
- name: "CONSUL_CLIENT | Assert inputs | get_app_config.yml"
  ansible.builtin.assert:
    that:
      - (ENV.CONSUL.SCHEME.INTERNAL is defined) and (ENV.CONSUL.SCHEME.INTERNAL|length > 0)     # Scheme of the Consul instance
      - (ENV.CONSUL.HOST.INTERNAL is defined) and (ENV.CONSUL.HOST.INTERNAL|length > 0)         # Host of the Consul instance
      - (ENV.CONSUL.PORT.INTERNAL is defined)                                      # Port of the Consul instance
      - (_consul_token is defined) and (_consul_token|length > 0)     # Token to authenticate with Consul
      - (_app_name is defined) and (_app_name|length > 0)             # Name of the app for which the config should be get

- name: "CONSUL_CLIENT | Set Consul KV path for config of app '{{ _app_name }}'"
  ansible.builtin.set_fact:
    __consul_kv_path: "config/{{ _app_name }}/data"

- name: "CONSUL_CLIENT | Check if config exists in Consul at '{{ __consul_kv_path }}'"
  ansible.builtin.uri:
    url: "{{ ENV.CONSUL.SCHEME.INTERNAL }}://{{ ENV.CONSUL.HOST.INTERNAL }}:{{ ENV.CONSUL.PORT.INTERNAL }}/v1/kv/{{ __consul_kv_path }}"
    method: GET
    headers:
      "X-Consul-Token": "{{ _consul_token }}"
    return_content: true
    status_code: 200,404
  register: app_config_consul_response

- name: "CONSUL_CLIENT | Extract config from Consul response (if exists)"
  when:
    - (app_config_consul_response.json is defined) and (app_config_consul_response.json | length > 0)
    - ((app_config_consul_response.json | first).Value is defined) and ((app_config_consul_response.json | first).Value | length > 0)
  ansible.builtin.set_fact:
    app_config_consul: "{{ (app_config_consul_response.json | first).Value | b64decode | from_yaml }}"

- name: "CONSUL_CLIENT | Set default to app_config_consul if response is empty"
  when: (app_config_consul is not defined)
  ansible.builtin.set_fact:
    app_config_consul: {}

